# Each key can be overridden by -Dkey=value or an environment variable (dots -> underscores, upper case),
# e.g. FIGMA_CLIENT_SECRET. Prefer the environment for secrets.

# OAuth scopes. file_read / files:read were removed by Figma on 2025-11-17.
# projects:read is needed by /design/convert.do and /design/convertAll.do (team -> projects -> files).
figma.oauth.scope=file_content:read projects:read
# Figma has no "my teams" API; the team whose projects /design/convert.do lists.
figma.team.id=1420657369280493518

# /design/convertDirect.do and /designForm/convertFigmaToFormClx.do (personal access token, max 90 days).
