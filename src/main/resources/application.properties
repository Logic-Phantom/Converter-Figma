# File key or full Figma URL (a URL with ?node-id= converts only that frame).
figma.direct.fileKey=x5gR79q0HUZ567W3CjCuCJ

# ---------------------------------------------------------------------------
# AI 보조 변환 (v2.1, /designAi/*). docs/ai-architecture.md 참고.
# none = AI 호출 없음(기본, v2.0 과 동일 결과) | gemini | ollama
figma.ai.provider=none
# Gemini 무료 등급. 키는 환경변수 FIGMA_AI_GEMINI_APIKEY 권장.
# 주의: 무료 등급은 입력이 Google 제품 개선에 사용된다. 기밀 디자인은 ollama 를 쓸 것.
figma.ai.gemini.apiKey=
figma.ai.gemini.model=gemini-3.5-flash-lite
figma.ai.gemini.url=https://generativelanguage.googleapis.com
# 사내망 로컬 모델 (외부 전송 없음)
figma.ai.ollama.url=http://127.0.0.1:11434
figma.ai.ollama.model=qwen3:4b
# 화면 렌더 PNG 를 함께 보낼지 (이미지 토큰 사용, Figma /v1/images 호출 1회)
figma.ai.screenshot=false
figma.ai.screenshot.maxSide=1024
# 그리드 컬럼 코드 이름 짓기(사전→캐시→AI), 검증 실패 시 수리 루프
figma.ai.naming=true
figma.ai.repair=true
figma.ai.timeoutSeconds=60
figma.ai.maxRetries=1
figma.ai.maxOutputTokens=4096

# ---------------------------------------------------------------------------
# v2.2 — OpenAPI 바인딩 / 테마 동기화 / 시각 QA (README §14)
# 모든 변환 엔드포인트의 swagger=<OpenAPI/Swagger JSON URL> 파라미터로 DataSet/DataMap/Submission 을 생성한다.
# 생성되는 submission action 의 접두어. 비우면 스펙의 servers[0].url / basePath 를 쓴다 (예: /api/v1).
figma.api.baseUrl=
# 시각 QA (qa=true): 헤드리스 브라우저 실행 파일. 비우면 Chrome/Edge/Chromium 기본 설치 경로를 찾는다.
figma.qa.browser=
# auto | playwright  (playwright 는 Node + npx playwright 가 있을 때 `npx playwright screenshot` 사용)
figma.qa.renderer=auto
# e6-compiler.jar 경로 (비우면 ci-lib/clx/e6-compiler.jar), 렌더 대기(ms), pixelmatch 임계값(0~1), 작업 폴더 보존
figma.qa.compiler=
figma.qa.settleMillis=6000
figma.qa.browserTimeoutSeconds=90
figma.qa.threshold=0.1
figma.qa.keepWork=false
# 테마 동기화: 전역 변수 ↔ 토큰 이름 정규식 (기본 규칙은 FigmaThemeSync.DEFAULT_MAP). 예)
# figma.theme.map.focus-border-color=(?i)^Brand/color/primary/500$
