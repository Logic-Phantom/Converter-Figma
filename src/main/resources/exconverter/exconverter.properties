# Converter-Figma: Figma REST JSON -> UI-IR -> template CLX.
# Lookup order: JVM -Dkey=value > environment variable (dots -> underscores, upper case) > this file.

# Template repository: the project's templates/ folder (P1~P8 patterns copied from eXConverter-AI).
# Read directly from the project source so an added template is used without Publish.
exconverter.template.useProjectFolder=true
# Force a template root (absolute path). Empty = templates/ of the project.
exconverter.template.root=

# Project root holding clx-src. Empty = auto-detect (Converter-Figma / eXCoverter-Figma in the workspace).
exconverter.project.root=
# Result folder under clx-src. Generated files go to clx-src/<folder>/<yyyy-MM-dd>/<frame name>.clx/.js
exconverter.clx.result.folder=convertTest
# Absolute result root; overrides the folder above.
exconverter.clx.result.root=
# UI-IR produced from Figma is written to <generated.root>/ui-ir for debugging.
exconverter.generated.root=generated
