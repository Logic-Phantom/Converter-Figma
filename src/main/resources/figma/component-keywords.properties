# Figma component → eXBuilder6 control keywords (FigmaComponentClassifier).
# Matched against, in order: the component SET name ("Base-input"), the main component name, the layer name.
# Names are compared lower-case without spaces/-/_/ ("Base-input" == "baseinput"). First kind in the list below wins,
# so keep specific kinds (radio) before general ones (button). Uncomment a line to REPLACE that kind's defaults.
#
# component.ignore=icon,breadcrumb,logo,divider,scrollbar,tooltip,cursor,avatar,badge,spinner-loading,chevron,arrow
# component.pagination=pagination,paging,pageindexer,pager,페이지네이션
# component.daterange=daterange,period,기간
# component.dateinput=dateinput,datepicker,date,calendar,달력,날짜,일자
# component.combobox=combobox,combo,select,dropdown,콤보,셀렉트,드롭다운
# component.searchinput=searchinput,searchfield,검색입력
# component.checkbox=checkbox,check,체크
# component.radiobutton=radio,라디오
# component.textarea=textarea,multiline,텍스트영역
# component.numbereditor=numbereditor,numberinput,stepper
# component.maskeditor=maskeditor,mask
# component.inputbox=inputbox,input,textfield,textbox,입력
# component.button=button,btn,버튼
#
# Not configurable here: tabs ("tab" but not "table"), grids (frame names with table/grid/그리드/테이블, except
# register/form/detail/등록/상세 = form tables), page title frames (title/appheader/타이틀).
# An input whose VISIBLE icon is arrow-down/chevron-down becomes a combobox, calendar a dateinput, search a searchinput.
